<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIRI Picture Web</title>
  <style>
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px 30px;
      border-radius: 20px;
      font-size: 24px;
      font-weight: bold;
      z-index: 999;
      transition: 0.3s ease;
      text-align: center;
      max-width: 80%;
    }.popup.show {
  transform: translate(-50%, -50%) scale(1);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #e9e9e9;
  overflow-x: hidden;
  min-height: 100vh;
  padding: 30px;
  position: relative;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 40px;
  align-items: center;
  justify-items: center;
}

.card {
  text-align: center;
  animation: fadeIn 1s ease;
}

.frame {
  background: white;
  border: 10px solid #bdbdbd;
  border-radius: 10px;
  padding: 8px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.frame img {
  width: 100%;
  max-width: 260px;
  border-radius: 5px;
  display: block;
}

.small img {
  max-width: 220px;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 45px;
  letter-spacing: 3px;
  color: #333;
}

.caption {
  margin-top: 12px;
  font-size: 22px;
  font-weight: bold;
  color: #111;
}

.outline {
  font-size: 40px;
  color: transparent;
  -webkit-text-stroke: 1px #222;
  text-align: center;
  margin: 30px 0;
  font-weight: bold;
}

.grid-decoration {
  position: absolute;
  width: 120px;
  height: 120px;
  background-image: linear-gradient(#000 2px, transparent 2px),
                    linear-gradient(90deg, #000 2px, transparent 2px);
  background-size: 20px 20px;
  opacity: 0.3;
}

.g1 { top: 0; left: 0; }
.g2 { bottom: 0; right: 0; }
.g3 { top: 50%; left: 0; }

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  h1 {
    font-size: 30px;
  }

  .outline {
    font-size: 28px;
  }

  .caption {
    font-size: 18px;
  }
}

  </style>
</head>
<body><div class="popup" id="popupText">Ini cewek aku yang cantik mode gemoy 💖</div>  <div class="grid-decoration g1"></div>
  <div class="grid-decoration g2"></div>
  <div class="grid-decoration g3"></div>  <h1>THIS PICTURE MY RIRI</h1>  <div class="container"><div class="card">
  <div class="frame" onclick="showPopup()">
    <img src="1000561770.jpg" alt="Gemoy Picture">
  </div>
  <div class="caption">GEMOY PICTURE</div>
</div>

<div class="card small">
  <div class="frame" onclick="showPopup()">
    <img src="1000561770.jpg" alt="Mode Sama Cowok">
  </div>
  <div class="caption">mode sama cowok nya</div>
</div>

<div class="card small">
  <div class="frame" onclick="showPopup()">
    <img src="1000561770.jpg" alt="Mode Pamaer">
  </div>
  <div class="caption">mode pamaer</div>
</div>

<div class="card">
  <div class="frame" onclick="showPopup()">
    <img src="1000561770.jpg" alt="Mode Cantik">
  </div>
  <div class="caption">Mode Cantik Banget</div>
</div>

  </div><script>
  function showPopup() {
    const popup = document.getElementById('popupText');
    popup.classList.add('show');

    setTimeout(() => {
      popup.classList.remove('show');
    }, 2000);
  }
</script></body>
  </html>
